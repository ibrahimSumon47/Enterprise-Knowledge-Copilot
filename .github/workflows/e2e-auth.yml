name: Sign-in e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-in:
    runs-on: ubuntu-latest
    env:
      EKC_DEMO_PASSWORD: ${{ secrets.EKC_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --allow-build esbuild
      - name: Wait for the deployed site to serve this build
        run: node scripts/wait_for_web.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Sign in as every role on production
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
