name: Nightly eval

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      split:
        description: Golden split to run
        type: choice
        options: [dev, test, all]
        default: dev
      subset:
        description: Run the deterministic 12-question sample
        type: boolean
        default: true
      cache_tag:
        description: Answer-cache tag; change it when code changes
        type: string
        default: nightly
      throttle:
        description: Seconds between live questions
        type: number
        default: 2
      retry_outage:
        description: Retries per provider outage
        type: number
        default: 3

permissions:
  contents: read

jobs:
  llm-eval:
    name: LLM eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Answers are cached per question and configuration, so a run that dies on
      # a 429 resumes where it stopped the next night instead of paying twice.
      - name: Restore the answer cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: eval-answers-v1
          restore-keys: eval-answers-
      - name: LLM eval (dispatch input, retries on quota)
        env:
          EKC_API_URL: https://enterprise-knowledge-copilot-2u57.onrender.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EKC_DEMO_PASSWORD: ${{ secrets.EKC_DEMO_PASSWORD }}
          SPLIT: ${{ inputs.split || 'dev' }}
          SUBSET: ${{ (github.event_name == 'schedule' || inputs.subset) && '--subset' || '' }}
          CACHE_TAG: ${{ inputs.cache_tag || 'nightly' }}
          THROTTLE: ${{ inputs.throttle || 2 }}
          RETRY_OUTAGE: ${{ inputs.retry_outage || 3 }}
        run: |
          python eval/run_eval.py --split "$SPLIT" $SUBSET --retry-outage "$RETRY_OUTAGE" \
            --retry-wait 60 --throttle "$THROTTLE" --cache-tag "$CACHE_TAG"
      - name: Save the answer cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: eval-answers-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-eval
          path: |
            docs/reports/eval.json
            docs/reports/eval_dev.json
          if-no-files-found: ignore
