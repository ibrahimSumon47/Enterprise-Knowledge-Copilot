name: Reset demo passwords

# The demo accounts use @ekc.local addresses, which cannot receive recovery mail.
# Set EKC_DEMO_PASSWORD in repository secrets, then run this workflow to write that
# password to the existing Supabase Auth users. The value is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: reset the seven demo accounts
    runs-on: ubuntu-latest
    steps:
      - name: Update existing users through the Supabase Admin API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EKC_DEMO_PASSWORD: ${{ secrets.EKC_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${EKC_DEMO_PASSWORD:-}" ]; then
            echo "EKC_DEMO_PASSWORD secret is missing" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          password = os.environ["EKC_DEMO_PASSWORD"]
          emails = [
              "guest@ekc.local",
              "employee@ekc.local",
              "engineering@ekc.local",
              "security@ekc.local",
              "hr@ekc.local",
              "finance@ekc.local",
              "admin@ekc.local",
          ]
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          def call(method: str, path: str, payload: dict | None = None) -> dict:
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  f"{url}{path}", data=data, method=method, headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode() or "{}")

          users: dict[str, str] = {}
          page = 1
          while True:
              body = call("GET", f"/auth/v1/admin/users?page={page}&per_page=200")
              batch = body.get("users") or []
              for user in batch:
                  email = str(user.get("email") or "").lower()
                  if email:
                      users[email] = str(user["id"])
              if len(batch) < 200:
                  break
              page += 1

          missing = [email for email in emails if email not in users]
          if missing:
              raise SystemExit(f"missing Auth users: {', '.join(missing)}")

          for email in emails:
              call(
                  "PUT",
                  f"/auth/v1/admin/users/{users[email]}",
                  {"password": password},
              )
              print(f"{email}: password updated")
          PY
