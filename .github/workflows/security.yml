name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Advisory on the first runs: the findings are triaged in
      # docs/reports/security.md, then this stops being continue-on-error.
      - name: pip-audit
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r api/requirements.txt 2>&1 | tee pip-audit.txt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm audit
        continue-on-error: true
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high | tee pnpm-audit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: |
            pip-audit.txt
            pnpm-audit.txt
          if-no-files-found: ignore

  image:
    name: trivy and sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the API image
        run: docker build -t ekc-api:ci .
      # The published trivy-action resolves aquasecurity/setup-trivy@v0.2.1,
      # which no longer exists, so the scanner runs from its own image instead.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.57.1 fs             --scanners vuln,secret,config --severity HIGH,CRITICAL             --ignore-unfixed --exit-code 0             --format sarif --output /repo/trivy-fs.sarif /repo
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.57.1 image             --severity CRITICAL --ignore-unfixed --exit-code 1             --format sarif --output /repo/trivy-image.sarif ekc-api:ci
      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload image results
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: CycloneDX SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.57.1 image             --format cyclonedx --output /repo/sbom.cdx.json ekc-api:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  scorecard:
    name: openssf scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # scorecard-action is a Docker action published on gcr.io, and gcr.io pulls
    # currently fail on hosted runners with Google's "billing" registry error.
    # The job stays so the check appears, but it must not fail the whole run for
    # a registry outage the repository cannot fix.
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: scorecard.sarif
