name: Space secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Set Space secrets (values never printed)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["HF_TOKEN"]
          repo = "NoobMaster005/ekc-api"
          secrets = {
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_DB_URL": os.environ["SUPABASE_DB_URL"],
              "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "SUPABASE_ANON_KEY": os.environ["SUPABASE_ANON_KEY"],
              "GROQ_API_KEY": os.environ["GROQ_API_KEY"],
              "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
              "ALLOWED_ORIGINS": "https://enterprise-knowledge-copilot-wine.vercel.app",
          }
          for key, value in secrets.items():
              if not value:
                  print(key, "skipped (empty)")
                  continue
              body = json.dumps({"key": key, "value": value, "description": ""}).encode()
              req = urllib.request.Request(
                  f"https://huggingface.co/api/spaces/{repo}/secrets",
                  data=body,
                  method="POST",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      print(key, "set", res.status)
              except urllib.error.HTTPError as exc:
                  print(key, "failed", exc.code, exc.read().decode()[:120])
                  raise
          PY
