# Render blueprint for the FastAPI service. Free plan, Docker, no Render database
# (the app talks to Supabase Postgres over its session pooler).
#
# Secrets are marked sync: false so Render asks for them once in the dashboard
# instead of storing them in this file.
services:
  - type: web
    name: ekc-api
    runtime: docker
    plan: free
    region: singapore
    # Root context with the default Dockerfile path: no extra settings in the
    # dashboard, and the COPY lines resolve from the repository root.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # 512 MB cannot hold the encoder and the cross-encoder at once.
      # Set to 1 on an instance with more memory to restore full reranking.
      - key: EKC_RERANK_ENABLED
        value: "0"
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: ALLOWED_ORIGINS
        value: https://enterprise-knowledge-copilot-wine.vercel.app,http://localhost:3000
