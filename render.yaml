# Render blueprint for the FastAPI service. Free plan, Docker, no Render database
# (the app talks to Supabase Postgres over its session pooler).
#
# Secrets are marked sync: false so Render asks for them once in the dashboard
# instead of storing them in this file.
services:
  - type: web
    name: ekc-api
    runtime: docker
    plan: free
    region: singapore
    # Root context with the default Dockerfile path: no extra settings in the
    # dashboard, and the COPY lines resolve from the repository root.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    # Docs and web commits must not restart the free instance. Render rebuilds
    # only for paths the image actually contains.
    buildFilter:
      paths:
        - api/**
        - Dockerfile
        - render.yaml
        - data/corpus.jsonl
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # bge-small leaves room for the TinyBERT cross-encoder inside 512 MB.
      - key: EKC_RERANK_ENABLED
        value: "1"
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: ALLOWED_ORIGINS
        value: https://enterprise-knowledge-copilot-wine.vercel.app,http://localhost:3000
